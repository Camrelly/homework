<!doctype html>
<html lang="en">
	<head>
		<meta charset="UTF-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1.0" />
		<title>Форма</title>
		<link rel="stylesheet" href="./css/style.css" />
	</head>
	<body>
		<form class="form">
			<fieldset class="form-group">
				<h2>Ваши личные данные</h2>
				<label class="label">
					Ваше имя
					<input type="text" placeholder="Имя" name="name" required />
				</label>
				<label class="label">
					Ваш возраст
					<input type="number" placeholder="Возраст" name="age" required />
				</label>
				<label class="label">
					Ваш номер телефона
					<input type="tel" placeholder="Номер телефона" name="tel" required />
				</label>
				<label class="label">
					Ваша почта
					<input type="email" placeholder="Почта" name="email" required />
				</label>
			</fieldset>
			<fieldset class="form-group">
				<label class="label">
					Сообщение
					<textarea
						placeholder="Ваше сообщение"
						class="textarea"
						name="text"
						required
					></textarea>
				</label>
				<label class="checkbox">
					<input type="checkbox" name="third" value="third" required />
					Я принимаю правила
				</label>
				<button class="button" type="submit">Отправить</button>
			</fieldset>
		</form>
	</body>
</html>
